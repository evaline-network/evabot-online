# EvaBot Docs — nginx include snippet
# Включить в server { } блок основного конфига:
#   include /var/www/evabot-backend/config/nginx-docs.conf;
# НЕ редактирует /etc/nginx напрямую.

location ^~ /docs/ {
    alias /var/www/evabot-backend/docs-site/public/;
    index index.html;
    try_files $uri $uri/ $uri/index.html =404;
}
