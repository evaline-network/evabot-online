# EvaBot Online // fail2ban jail
# Place at: /etc/fail2ban/jail.d/evabot.conf

[evabot-attack]
enabled  = true
filter   = evabot
logpath  = /var/www/evabot-backend/logs/evabot.log
maxretry = 5
findtime = 600
bantime  = 86400
action   = iptables-multiport[name=evabot, port="80,443,3000", protocol=tcp]

[evabot-rate]
enabled  = true
filter   = evabot
logpath  = /var/www/evabot-backend/logs/evabot.log
maxretry = 50
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=evabot-rate, port="80,443,3000", protocol=tcp]
